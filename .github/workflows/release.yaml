name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  github-release:
    name: "Create draft GitHub Release"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Get the version
        id: get_version
        shell: bash
        run: |
          VERSION="$GITHUB_REF_NAME"
          # CalVer scheme YYYY.M.MICRO (https://calver.org): the major is the
          # full four-digit year, the minor is the month (1-12, never
          # zero-padded), and the micro counts releases within the month.
          # Unpadded segments keep every version a valid SemVer string.
          if [[ ! "$VERSION" =~ ^v?[1-9][0-9]{3}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$VERSION" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Cargo package version
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["VERSION"]
          version = tag.removeprefix("v")
          package = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          if version != package:
              raise SystemExit(f"Release tag {tag!r} does not match Cargo package version {package!r}")
          PY

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --draft \
            --generate-notes

  build:
    name: Build for ${{ matrix.platform.target }}
    needs: github-release
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ARCHIVE: vss_${{ matrix.platform.os_name }}_${{ matrix.platform.arch_name }}.${{ matrix.platform.archive_ext }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch_name: amd64
            archive_ext: tar.gz

          # Linux aarch64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch_name: arm64
            archive_ext: tar.gz

          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch_name: arm64
            archive_ext: tar.gz

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch_name: amd64
            archive_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Get commit hash
        id: get_commit
        shell: bash
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "Commit: $COMMIT"

      - name: Build
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.platform.target }}
        env:
          VSS_COMMIT: ${{ steps.get_commit.outputs.commit }}

      - name: Prepare binary (Unix)
        if: matrix.platform.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.platform.target }}/release/vss dist/
          chmod +x dist/vss

      - name: Prepare binary (Windows)
        if: matrix.platform.os_name == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.platform.target }}/release/vss.exe dist/

      - name: Create tar.gz archive
        if: matrix.platform.archive_ext == 'tar.gz'
        shell: bash
        run: |
          cd dist
          tar czf ../vss_${{ matrix.platform.os_name }}_${{ matrix.platform.arch_name }}.tar.gz vss
          cd ..

      - name: Create zip archive
        if: matrix.platform.archive_ext == 'zip'
        shell: bash
        run: |
          cd dist
          7z a ../vss_${{ matrix.platform.os_name }}_${{ matrix.platform.arch_name }}.zip vss.exe
          cd ..

      - name: Generate checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Attest release archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.github-release.outputs.version }}
        shell: bash
        run: |
          gh release upload "$VERSION" "$ARCHIVE" "$ARCHIVE.sha256"

  publish:
    name: "Publish GitHub Release"
    permissions:
      contents: write
    needs: [github-release, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release after all assets are uploaded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.github-release.outputs.version }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

