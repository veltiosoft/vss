name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - run: rustup update ${{ matrix.toolchain }}
      - run: cargo check --all
      - run: cargo test --all --locked

  scaffold:
    name: Scaffold (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Use CRLF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - name: Checkout sources
        uses: actions/checkout@v5
      - run: rustup update stable
      - run: cargo test --locked --test new_command --test config_paths --test install_scripts
      - run: cargo test --locked --lib subcommand_build::tests
      - name: Test signed updates and isolated subprocess self replacement
        run: |
          cargo test --locked --lib subcommand_self::update
          cargo test --locked --test self_update_cli

  audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - run: rustup update stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Reject vulnerable dependencies
        run: cargo audit

  lints:
    name: Lints
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - run: rustup update ${{ matrix.toolchain }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all -- -D warnings

