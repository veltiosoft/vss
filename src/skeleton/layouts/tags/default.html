<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{tag_name}} | {{site_title}}</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header><a href="/">{{site_title}}</a></header>
    <main>
        <h1>{{tag_name}}</h1>
        <ul>
            {{#posts}}

            {{/posts}}
        </ul>
    </main>
</body>
</html>
