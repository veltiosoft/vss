[package]
name = "vss"
version = "0.21.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = "0.7"
gray_matter = { version = "0.2", default-features = false }
markdown = "1.0.0"
noargs = "0.4.1"
percent-encoding = "2.3"
notify = "8.0"
notify-debouncer-full = "0.5"
ramhorns = "0.14"
same-file = "1.0"
self_update = { version = "1.3.2", default-features = false, features = ["ureq", "github", "progress-bar", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
tokio = { version = "1.53.3", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
glob = "0.3.3"
semver = "1.0"
tempfile = "3"
webpki-roots = "1.0"
