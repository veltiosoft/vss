<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script>
        // Apply a saved override before the first paint.
        try {
            const scheme = localStorage.getItem("vss-color-scheme");
            if (scheme === "light" || scheme === "dark") {
                document.querySelector('meta[name="color-scheme"]').content = scheme;
                document.documentElement.dataset.colorScheme = scheme;
            }
        } catch {
            // Follow the system when storage is unavailable.
        }
    </script>
    <meta name="description" content="{{site_description}}">
    <title>{{site_title}}</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg">
    <link rel="stylesheet" href="./styles/main.css">
    <script src="./js/color-scheme.js" defer></script>
</head>
<body>
    <main>
        <button class="theme-toggle" type="button" aria-label="ダークモード" aria-pressed="false" hidden>
            <svg class="theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M8.3 3.8A9 9 0 1 0 20.2 15.7A9 9 0 0 1 8.3 3.8Z"/>
            </svg>
            <svg class="theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <circle cx="12" cy="12" r="4.5"/>
                <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4m11.2-11.2L19 5"/>
            </svg>
        </button>
        {{{contents}}}
    </main>
</body>
</html>
